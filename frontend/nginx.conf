# nginx del frontend: archivos estáticos + proxy de /api al backend.

# IP real del cliente. Solo se confía en la cabecera X-Forwarded-For cuando la
# request llega del proxy HTTPS (Caddy, IP fija en docker-compose.yml): Caddy
# descarta la cabecera que envía el cliente y escribe la IP verdadera. Para
# cualquier otro origen se usa la dirección de la conexión, así nadie puede
# inventarse una IP (por ejemplo, para esquivar el bloqueo de intentos de login).
set_real_ip_from 172.30.250.10;
real_ip_header X-Forwarded-For;

# Protocolo original: https si viene de Caddy; si no, el de esta conexión.
map $realip_remote_addr $forwarded_proto {
    172.30.250.10 $http_x_forwarded_proto;
    default       $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # MAX_UPLOAD_MB (5 MB) + margen del multipart. El backend vuelve a validar.
    client_max_body_size 6m;

    # Cabeceras de seguridad para la aplicación.
    # - CSP: solo recursos propios; la cámara produce blob: para el vídeo.
    # - Permissions-Policy: la cámara solo para este origen; micrófono y ubicación, nunca.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Si nginx corta un upload, responde con el mismo formato que la API
    # ({detail, code}) para que el frontend muestre un mensaje claro.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"La imagen supera el tamaño máximo permitido.","code":"payload_too_large"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se reemplazan (no se agregan): el backend recibe una sola IP, la real.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # El reconocimiento de un frame tarda milisegundos; el registro, algo más.
        proxy_read_timeout 60s;
        # El backend también envía estas cabeceras; nginx agrega las suyas (server):
        # se ocultan las del backend para no duplicarlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header en un location reemplaza los del server: se repiten los de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (/personas/123) sirve index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
